<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar / Cadastrar - Guia Comercial Alfenas</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .auth-container {
            max-width: 480px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            background: #f1f5f9;
        }

        .tab-btn {
            flex: 1;
            padding: 16px;
            text-align: center;
            background: none;
            border: none;
            font-weight: 600;
            font-size: 15px;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #2563eb;
            border-bottom: 3px solid #2563eb;
        }

        .auth-body {
            padding: 30px 25px;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .input-with-icon input,
        .input-with-icon select {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-with-icon input:focus,
        .input-with-icon select:focus {
            border-color: #2563eb;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .forgot-link {
            color: #2563eb;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            background: #2563eb;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .auth-header-text {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-header-text h2 {
            font-size: 22px;
            color: #1e293b;
        }

        .auth-header-text p {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-location-dot"></i> GUIA<span>ALFENAS</span>
            </a>
            
            <nav class="nav-links">
                <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao site</a>
            </nav>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" onclick="switchTab('login')">Acessar Conta</button>
                <button type="button" class="tab-btn" onclick="switchTab('register')">Criar Conta</button>
            </div>

            <div class="auth-body">

                <form action="../dashboard/dashboard.html" method="GET" id="form-login" class="auth-form active">
                    <div class="auth-header-text">
                        <h2>Bem-vindo de volta!</h2>
                        <p>Acesse seu painel para gerenciar seus anúncios.</p>
                    </div>

                    <div class="form-group">
                        <label for="login-email">E-mail *</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="login-email" placeholder="seu@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Senha *</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="login-password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: #475569;">
                            <input type="checkbox"> Lembrar de mim
                        </label>
                        <a href="#" class="forgot-link">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-right-to-bracket"></i> ENTRAR NO PAINEL
                    </button>
                </form>

                <form action="../dashboard/cadastrar-anuncio.html" method="GET" id="form-register" class="auth-form">
                    <div class="auth-header-text">
                        <h2>Crie sua conta</h2>
                        <p>Cadastre-se para publicar e divulgar sua empresa.</p>
                    </div>

                    <div class="form-group">
                        <label for="reg-name">Nome Completo *</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="reg-name" placeholder="Seu nome completo" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-phone">WhatsApp / Telefone *</label>
                        <div class="input-with-icon">
                            <i class="fa-brands fa-whatsapp"></i>
                            <input type="tel" id="reg-phone" placeholder="(35) 99999-9999" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">E-mail Comercial *</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="reg-email" placeholder="seuemail@empresa.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Crie uma Senha *</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="reg-password" placeholder="Mínimo de 6 caracteres" required minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-rocket"></i> CRIAR CONTA E ANUNCIAR
                    </button>
                </form>

            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container" style="text-align: center;">
            <p>&copy; 2026 Guia Comercial Alfenas. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        function switchTab(tabName) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabs = document.querySelectorAll('.tab-btn');

            if (tabName === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
            }
        }

        // Se a URL tiver ?tab=register (ex: vindo da tela de planos), abre a aba de cadastro automaticamente
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('tab') === 'register' || urlParams.get('plano')) {
                switchTab('register');
            }
        });
        document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
    });

    if (error) {
        alert('E-mail ou senha incorretos.');
        return;
    }

    window.location.href = 'dashboard.html';
});
    </script>
</body>
</html>
